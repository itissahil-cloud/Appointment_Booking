services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_booking_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic_admin} -d ${POSTGRES_DB:-clinic_booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-clinic_admin}:${POSTGRES_PASSWORD:-clinic_secure_password_2026}@postgres:5432/${POSTGRES_DB:-clinic_booking_db}?schema=public"
      PORT: 4000
      NODE_ENV: production
      APP_URL: "https://drskpoddar.in"
      FRONTEND_URL: "https://drskpoddar.in"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://drskpoddar.in/api"
    container_name: clinic_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "https://drskpoddar.in/api"
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
